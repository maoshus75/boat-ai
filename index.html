<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOAT AI | 競艇AI予想</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="header">

    <div class="logo">

      BOAT <span>AI</span>

    </div>

    <div class="header-date" id="today"></div>

  </header>

  <main>

    <!-- ヒーロー -->

    <section class="hero">

      <div class="hero-label">

        AI BOAT RACE PREDICTION

      </div>

      <h1>

        競艇AI予想

      </h1>

      <p>

        独自AI分析による本命・穴・買い目をチェック

      </p>

    </section>

    <!-- レース選択 -->

    <section class="race-section">

      <div class="section-title">

        <span>注目レース</span>

      </div>

      <div id="raceButtons" class="race-grid"></div>

    </section>

    <!-- AI予想 -->

    <section class="prediction-panel">

      <div class="panel-header">

        <div>

          <div class="small-label">

            AI PREDICTION

          </div>

          <h2 id="raceName">

            -

          </h2>

        </div>

        <div id="rating" class="rating">

          -

        </div>

      </div>

      <!-- 本命 -->

      <div class="main-pick">

        <div class="pick-label">

          AI本命

        </div>

        <div id="mainPick" class="main-pick-number">

          -

        </div>

        <div id="mainPickName" class="main-pick-name">

          -

        </div>

      </div>

      <!-- AI評価 -->

      <div class="info-grid">

        <div class="info-card">

          <div class="info-label">

            穴候補

          </div>

          <div id="hole" class="info-value">

            -

          </div>

        </div>

        <div class="info-card">

          <div class="info-label">

            勝率

          </div>

          <div id="winRate" class="info-value">

            -

          </div>

        </div>

      </div>

      <!-- AIコメント -->

      <div class="comment-box">

        <div class="comment-title">

          AIコメント

        </div>

        <p id="comment">

          -

        </p>

      </div>

      <!-- 買い目 -->

      <div class="bets-box">

        <div class="bets-title">

          推奨買い目

        </div>

        <div id="bets" class="bets-value">

          -

        </div>

      </div>

      <!-- 6艇AI分析 -->

      <div class="boats-section">

        <div class="boats-title">

          <h3>6艇AI分析</h3>

          <span>AI評価</span>

        </div>

        <div id="boatsList" class="boats-list"></div>

      </div>

    </section>

  </main>

  <footer>

    <p>

      © BOAT AI

    </p>

    <p>

      ※本サイトの予想・数値はAIによる分析結果です。

    </p>

  </footer>

  <script>

  alert("index.html 起動");

</script>

<script

  src="app.js?v=20260824-2"

  onload="alert('app.js 読み込み成功')"

  onerror="alert('app.js 読み込み失敗')"

></script>

</body>

</html>
