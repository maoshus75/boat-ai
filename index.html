<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOAT AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="header">

    <div class="brand">🚤 BOAT AI</div>

    <div class="badge">PROTOTYPE</div>

  </header>

  <main class="container">

    <!-- ヘッダー -->

    <section class="hero">

      <div class="eyebrow">AI BOAT RACE ANALYSIS</div>

      <h1>今日の注目レース</h1>

      <p class="description">

        勝率・展示・ST・モーターなどをもとに分析する

        BOAT AIのプロトタイプです。

      </p>

      <div class="date">

        2026 / 08 / 23

      </div>

    </section>

    <!-- レース選択 -->

    <section class="race-section">

      <h2>注目レース</h2>

      <div class="race-grid">

        <button

          type="button"

          class="race-card active"

          data-race="戸田 10R"

        >

          <span class="race-place">戸田</span>

          <strong class="race-number">10R</strong>

        </button>

        <button

          type="button"

          class="race-card"

          data-race="平和島 8R"

        >

          <span class="race-place">平和島</span>

          <strong class="race-number">8R</strong>

        </button>

        <button

          type="button"

          class="race-card"

          data-race="江戸川 11R"

        >

          <span class="race-place">江戸川</span>

          <strong class="race-number">11R</strong>

        </button>

      </div>

    </section>

    <!-- AI予想 -->

    <section class="prediction-panel">

      <div class="panel-header">

        <h2 id="raceName">

          戸田 10R

        </h2>

        <div id="rating" class="rating">

          ★★★★★

        </div>

      </div>

      <!-- 本命 -->

      <div class="main-pick">

        <div class="pick-label">

          AI本命

        </div>

        <div

          id="mainPick"

          class="main-pick-number"

        >

          1号艇

        </div>

      </div>

      <!-- 情報 -->

      <div class="info-list">

        <div class="info-row">

          <span>AI信頼度</span>

          <strong id="confidence">

            ★★★★★

          </strong>

        </div>

        <div class="info-row">

          <span>穴候補</span>

          <strong id="hole">

            4号艇

          </strong>

        </div>

        <div class="info-row">

          <span>AI勝率</span>

          <strong id="winRate">

            48.2%

          </strong>

        </div>

      </div>

      <!-- コメント -->

      <div class="comment-box">

        <div class="comment-title">

          AIコメント

        </div>

        <p id="comment">

          イン有利を中心に1号艇を本命評価。

          まずは1号艇を軸に展開を考える。

        </p>

      </div>

      <!-- 買い目 -->

      <div class="bets-box">

        <div class="bets-title">

          買い目候補

        </div>

        <div

          id="bets"

          class="bets-value"

        >

          1-2-4 / 1-4-2 / 1-2-3

        </div>

      </div>

    </section>

  </main>

  <footer>

    ※このサイトはプロトタイプです。

    表示される予想・数値はサンプルです。

  </footer>

  <script src="app.js"></script>

</body>

</html>
